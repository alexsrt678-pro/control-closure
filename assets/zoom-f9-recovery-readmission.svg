<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
<style>.bg{fill:#f5f0e6}.ink{fill:#24333d}.muted{fill:#61707a}.g{fill:#bfd8b8}.y{fill:#e8d28b}.u{fill:#d8d3ca}.card{stroke:#c4bbae;stroke-width:2}.h{font:700 40px Arial}.s{font:400 23px Arial}.q{font:700 30px Arial}.t{font:700 21px Arial}.d{font:400 17px Arial}.w{fill:white}</style>
<rect class="bg" width="1600" height="980"/><rect x="45" y="35" width="1510" height="110" rx="22" fill="#7da581"/>
<text x="75" y="82" class="h w">ZOOM 3 — REPAIR / RECOVER / RE-ADMIT</text><text x="75" y="120" class="s w">Recovery exists ≠ the system is allowed to continue</text>
<text x="70" y="200" class="q ink">When is a failed system truly admissible again?</text>
<rect x="70" y="255" width="330" height="170" rx="18" class="g card"/><text x="90" y="297" class="t ink">Incident detected</text><text x="90" y="339" class="d muted">Failure is observed</text><rect x="448" y="255" width="330" height="170" rx="18" class="y card"/><text x="468" y="297" class="t ink">Cause localized</text><text x="468" y="339" class="d muted">Failure source is identified</text><rect x="826" y="255" width="330" height="170" rx="18" class="y card"/><text x="846" y="297" class="t ink">Repair applied</text><text x="846" y="339" class="d muted">A corrective change is made</text><rect x="1204" y="255" width="330" height="170" rx="18" class="y card"/><text x="1224" y="297" class="t ink">Repair verified</text><text x="1224" y="339" class="d muted">The fix is independently checked</text><rect x="70" y="465" width="330" height="170" rx="18" class="y card"/><text x="90" y="507" class="t ink">Old evidence invalidated</text><text x="90" y="549" class="d muted">Proof from the old state is retired</text><rect x="448" y="465" width="330" height="170" rx="18" class="y card"/><text x="468" y="507" class="t ink">Authority recalculated</text><text x="468" y="549" class="d muted">Permissions reflect the repaired state</text><rect x="826" y="465" width="330" height="170" rx="18" class="u card"/><text x="846" y="507" class="t ink">Re-admission granted</text><text x="846" y="549" class="d muted">System is explicitly admitted again</text><rect x="1204" y="465" width="330" height="170" rx="18" class="u card"/><text x="1224" y="507" class="t ink">Next cycle permitted</text><text x="1224" y="549" class="d muted">A new operating cycle is allowed</text>
<text x="70" y="720" class="q ink">Repair, verified recovery, re-admission and permission for the next cycle are different states.</text>
<text x="70" y="885" class="s" fill="#c85f4d">Green means “mechanism represented”, not “the control function is fully closed”.</text>
</svg>