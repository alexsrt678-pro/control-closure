<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
<style>.bg{fill:#f5f0e6}.ink{fill:#24333d}.muted{fill:#61707a}.g{fill:#bfd8b8}.y{fill:#e8d28b}.u{fill:#d8d3ca}.card{stroke:#c4bbae;stroke-width:2}.h{font:700 40px Arial}.s{font:400 23px Arial}.q{font:700 30px Arial}.t{font:700 23px Arial}.d{font:400 18px Arial}.w{fill:white}</style>
<rect class="bg" width="1600" height="980"/><rect x="45" y="35" width="1510" height="110" rx="22" fill="#c9785c"/>
<text x="75" y="82" class="h w">ZOOM 1 — TRACE / INTEGRITY</text><text x="75" y="120" class="s w">Evidence exists ≠ the state is proved</text>
<text x="70" y="200" class="q ink">Can the control system trust the evidence after the object changes?</text>
<rect x="70" y="255" width="330" height="170" rx="18" class="g card"/><text x="90" y="297" class="t ink">Evidence captured</text><text x="90" y="339" class="d muted">Logs / provenance exist</text><rect x="448" y="255" width="330" height="170" rx="18" class="y card"/><text x="468" y="297" class="t ink">Exact version binding</text><text x="468" y="339" class="d muted">Evidence tied to the exact object version</text><rect x="826" y="255" width="330" height="170" rx="18" class="y card"/><text x="846" y="297" class="t ink">Mutation invalidation</text><text x="846" y="339" class="d muted">Old proof expires after change</text><rect x="1204" y="255" width="330" height="170" rx="18" class="y card"/><text x="1224" y="297" class="t ink">Causal chain</text><text x="1224" y="339" class="d muted">Can we reconstruct what produced the state?</text><rect x="70" y="465" width="330" height="170" rx="18" class="y card"/><text x="90" y="507" class="t ink">Completeness</text><text x="90" y="549" class="d muted">Can omitted actions be ruled out?</text><rect x="448" y="465" width="330" height="170" rx="18" class="y card"/><text x="468" y="507" class="t ink">Restart persistence</text><text x="468" y="549" class="d muted">Does proof survive restart / process loss?</text><rect x="826" y="465" width="330" height="170" rx="18" class="u card"/><text x="846" y="507" class="t ink">Freshness</text><text x="846" y="549" class="d muted">When does old evidence become stale?</text>
<text x="70" y="720" class="q ink">Traceability is present, but closure depends on version, mutation, completeness and persistence.</text>
<text x="70" y="885" class="s" fill="#c85f4d">Green means “mechanism represented”, not “the control function is fully closed”.</text>
</svg>