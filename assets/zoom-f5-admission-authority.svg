<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
<style>.bg{fill:#f5f0e6}.ink{fill:#24333d}.muted{fill:#61707a}.g{fill:#bfd8b8}.y{fill:#e8d28b}.u{fill:#d8d3ca}.card{stroke:#c4bbae;stroke-width:2}.h{font:700 40px Arial}.s{font:400 23px Arial}.q{font:700 30px Arial}.t{font:700 22px Arial}.d{font:400 17px Arial}.w{fill:white}</style>
<rect class="bg" width="1600" height="980"/><rect x="45" y="35" width="1510" height="110" rx="22" fill="#d5aa2d"/>
<text x="75" y="82" class="h w">ZOOM 2 — ADMISSION / AUTHORITY</text><text x="75" y="120" class="s w">Permission exists ≠ this action is authorized now</text>
<text x="70" y="200" class="q ink">Who may perform this concrete action, here and now, and on what basis?</text>
<rect x="70" y="255" width="330" height="170" rx="18" class="g card"/><text x="90" y="297" class="t ink">Task scope</text><text x="90" y="339" class="d muted">Action is within the delegated task</text><rect x="448" y="255" width="330" height="170" rx="18" class="g card"/><text x="468" y="297" class="t ink">Pre-action gate</text><text x="468" y="339" class="d muted">Call is checked before execution</text><rect x="826" y="255" width="330" height="170" rx="18" class="g card"/><text x="846" y="297" class="t ink">Authority provenance</text><text x="846" y="339" class="d muted">Where did the authority come from?</text><rect x="1204" y="255" width="330" height="170" rx="18" class="y card"/><text x="1224" y="297" class="t ink">Delegation</text><text x="1224" y="339" class="d muted">Can authority move across actors?</text><rect x="70" y="465" width="330" height="170" rx="18" class="y card"/><text x="90" y="507" class="t ink">Revocation</text><text x="90" y="549" class="d muted">Can granted authority be withdrawn?</text><rect x="448" y="465" width="330" height="170" rx="18" class="y card"/><text x="468" y="507" class="t ink">Multi-hop enforcement</text><text x="468" y="549" class="d muted">Did revocation reach every execution point?</text><rect x="826" y="465" width="330" height="170" rx="18" class="y card"/><text x="846" y="507" class="t ink">Control mutation</text><text x="846" y="549" class="d muted">Do policy/object changes invalidate permission?</text><rect x="1204" y="465" width="330" height="170" rx="18" class="u card"/><text x="1224" y="507" class="t ink">Next permission</text><text x="1224" y="549" class="d muted">On what basis is the next action allowed?</text>
<text x="70" y="720" class="q ink">Authorization can be present while revocation, mutation and the next permission remain only partially closed.</text>
<text x="70" y="885" class="s" fill="#c85f4d">Green means “mechanism represented”, not “the control function is fully closed”.</text>
</svg>